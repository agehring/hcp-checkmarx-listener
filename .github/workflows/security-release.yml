name: Container Security and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  REGISTRY_DOCKER: ghcr.io
  REGISTRY_OPENSHIFT: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OPENSHIFT_IMAGE_NAME: ${{ github.repository }}-openshift

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/golang@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --sarif-file-output=snyk.sarif
        
    - name: Upload Snyk results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: snyk.sarif
        
    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec.sarif ./...'
        
    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec.sarif
        category: 'gosec'

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Determine version
      id: version
      run: |
        if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
          # Get latest tag and increment based on release type
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=$(echo $LATEST_TAG | sed 's/^v//')
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case "${{ github.event.inputs.release_type }}" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac
          echo "version=v$NEW_VERSION" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Generate changelog
      id: changelog
      run: |
        if git tag --list | grep -q .; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "## Changes since $PREVIOUS_TAG" > CHANGELOG.md
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
        else
          echo "## Initial Release" > CHANGELOG.md
          echo "- Initial release of HCP Terraform Checkmarx One Integration" >> CHANGELOG.md
        fi
        
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        bodyFile: CHANGELOG.md
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and release binaries
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-attestation:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_DOCKER }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Log in to GitHub Container Registry for OpenShift
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_OPENSHIFT }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Sign container images
      run: |
        # Sign Docker image
        cosign sign --yes ${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
        
        # Sign OpenShift image  
        cosign sign --yes ${{ env.REGISTRY_OPENSHIFT }}/${{ env.OPENSHIFT_IMAGE_NAME }}:${{ needs.release.outputs.version }}
        
    - name: Generate and attach attestations
      run: |
        # Generate SLSA provenance for Docker image
        cosign attest --yes --predicate-type slsaprovenance \
          --predicate <(echo '{"buildType": "https://github.com/slsa-framework/slsa/blob/v0.2/provenance/schema.md"}') \
          ${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
          
        # Generate SLSA provenance for OpenShift image
        cosign attest --yes --predicate-type slsaprovenance \
          --predicate <(echo '{"buildType": "https://github.com/slsa-framework/slsa/blob/v0.2/provenance/schema.md"}') \
          ${{ env.REGISTRY_OPENSHIFT }}/${{ env.OPENSHIFT_IMAGE_NAME }}:${{ needs.release.outputs.version }}

  notify:
    needs: [release, container-attestation]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.release.result == 'success' && needs.container-attestation.result == 'success'
      run: |
        echo "✅ Release ${{ needs.release.outputs.version }} completed successfully!"
        echo "📦 Docker image: ${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}"
        echo "🔄 OpenShift image: ${{ env.REGISTRY_OPENSHIFT }}/${{ env.OPENSHIFT_IMAGE_NAME }}:${{ needs.release.outputs.version }}"
        
    - name: Notify on failure
      if: needs.release.result == 'failure' || needs.container-attestation.result == 'failure'
      run: |
        echo "❌ Release process failed!"
        echo "Release status: ${{ needs.release.result }}"
        echo "Container attestation status: ${{ needs.container-attestation.result }}"
        exit 1