apiVersion: v1
kind: List
metadata:
  name: hcp-checkmarx-listener-all
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: hcp-checkmarx
    labels:
      name: hcp-checkmarx
      openshift.io/cluster-monitoring: "true"
    annotations:
      openshift.io/description: "HCP Terraform Checkmarx Integration"
      openshift.io/display-name: "HCP Checkmarx Listener"

- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: hcp-checkmarx-listener
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
  automountServiceAccountToken: false

- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: hcp-checkmarx-config
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
  data:
    config.yaml: |
      port: "8080"
      checkmarx_base_url: "https://ast.checkmarx.net"
      checkmarx_auth_url: "https://iam.checkmarx.net"
      checkmarx_region: "US"
      use_oauth: false
      enable_policy_check: true
      break_on_policy_violation: true
      log_level: "info"
      request_timeout: "60s"
      max_workers: 5
      queue_size: 100

- apiVersion: v1
  kind: Secret
  metadata:
    name: hcp-checkmarx-secrets
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
  type: Opaque
  data:
    # These should be set during deployment - base64 encoded
    checkmarx_api_key: ""
    checkmarx_client_id: ""
    checkmarx_client_secret: ""
    hmac_secret: ""

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: hcp-checkmarx-listener
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
      version: v1
  spec:
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1
    selector:
      matchLabels:
        app: hcp-checkmarx-listener
    template:
      metadata:
        labels:
          app: hcp-checkmarx-listener
          version: v1
      spec:
        serviceAccountName: hcp-checkmarx-listener
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 0
          fsGroup: 0
        containers:
        - name: hcp-checkmarx-listener
          image: hcp-checkmarx-listener:latest
          imagePullPolicy: Always
          ports:
          - name: http
            containerPort: 8080
            protocol: TCP
          env:
          - name: PORT
            value: "8080"
          - name: GIN_MODE
            value: "release"
          - name: CONFIG_FILE
            value: "/etc/config/config.yaml"
          - name: CHECKMARX_API_KEY
            valueFrom:
              secretKeyRef:
                name: hcp-checkmarx-secrets
                key: checkmarx_api_key
          - name: HMAC_SECRET
            valueFrom:
              secretKeyRef:
                name: hcp-checkmarx-secrets
                key: hmac_secret
          volumeMounts:
          - name: config-volume
            mountPath: /etc/config
            readOnly: true
          - name: tmp-volume
            mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
        volumes:
        - name: config-volume
          configMap:
            name: hcp-checkmarx-config
        - name: tmp-volume
          emptyDir: {}

- apiVersion: v1
  kind: Service
  metadata:
    name: hcp-checkmarx-listener
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
  spec:
    type: ClusterIP
    ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    selector:
      app: hcp-checkmarx-listener

- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: hcp-checkmarx-listener
    namespace: hcp-checkmarx
    labels:
      app: hcp-checkmarx-listener
  spec:
    to:
      kind: Service
      name: hcp-checkmarx-listener
      weight: 100
    port:
      targetPort: http
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect