apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-checkmarx-listener
  namespace: hcp-checkmarx
  labels:
    app: hcp-checkmarx-listener
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: hcp-checkmarx-listener
  template:
    metadata:
      labels:
        app: hcp-checkmarx-listener
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hcp-checkmarx-listener
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hcp-checkmarx-listener
        image: hcp-checkmarx-listener:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: GIN_MODE
          value: "release"
        - name: CONFIG_FILE
          value: "/etc/config/config.yaml"
        - name: SECRETS_FILE
          value: "/etc/secrets/secrets.yaml"
        - name: CHECKMARX_API_KEY
          valueFrom:
            secretKeyRef:
              name: hcp-checkmarx-secrets
              key: checkmarx_api_key
        - name: CHECKMARX_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: hcp-checkmarx-secrets
              key: checkmarx_client_id
              optional: true
        - name: CHECKMARX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hcp-checkmarx-secrets
              key: checkmarx_client_secret
              optional: true
        - name: HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: hcp-checkmarx-secrets
              key: hmac_secret
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: secrets-volume
          mountPath: /etc/secrets
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 0
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config-volume
        configMap:
          name: hcp-checkmarx-config
      - name: secrets-volume
        secret:
          secretName: hcp-checkmarx-secrets
      - name: tmp-volume
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hcp-checkmarx-listener
              topologyKey: kubernetes.io/hostname